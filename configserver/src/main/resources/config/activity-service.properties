spring.application.name=activity-service
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=aiFitnessActivity
server.port=8082
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
kafka.topic.name=activity-events


# ── Circuit Breaker ─────────────────────────────

resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.slow-call-duration-threshold=2000
resilience4j.circuitbreaker.instances.userService.register-health-indicator=true

# ── Retry ─────────────────────────────

resilience4j.retry.instances.userService.max-attempts=3
resilience4j.retry.instances.userService.wait-duration=500ms
resilience4j.retry.instances.userService.retry-exceptions[0]=java.io.IOException
resilience4j.retry.instances.userService.retry-exceptions[1]=java.util.concurrent.TimeoutException
resilience4j.retry.instances.userService.retry-exceptions[2]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.userService.ignore-exceptions[0]=java.lang.IllegalArgumentException

# ── Rate Limiter ─────────────────────────────

resilience4j.ratelimiter.instances.userService.limit-for-period=100
resilience4j.ratelimiter.instances.userService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.userService.timeout-duration=0s

# ── Time Limiter ─────────────────────────────

resilience4j.timelimiter.instances.userService.timeout-duration=3s

# ── Actuator ─────────────────────────────

management.endpoints.web.exposure.include=health,circuitbreakers,retries,ratelimiters
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
